name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/2.0 ]
  pull_request:
    branches: [ main, feature/2.0 ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_USERNAME: noletengine

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        file: ./api-gateway/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-api-gateway:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-api-gateway:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push microservices
      run: |
        for svc in orders inventory users reviews ratings; do
          docker buildx build ./services/$svc \
            -f ./services/$svc/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-$svc:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-$svc:latest \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max
        done

  deploy-home:
    name: Deploy to Home (Staging/Dev)
    runs-on: self-hosted   # <---- now uses your k8h runner
    needs: build
    if: github.ref == 'refs/heads/feature/2.0'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl for home cluster
      run: |
        echo "${{ secrets.KUBE_CONFIG_HOME }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config current-context

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Deploy to home (staging/dev)
      run: |
        export KUBECONFIG=kubeconfig
        ./scripts/deploy-helm.sh stage staging ${{ github.sha }}

    - name: Run smoke tests
      run: |
        export KUBECONFIG=kubeconfig
        kubectl wait --for=condition=available --timeout=300s deployment --all -n staging
        kubectl get pods -n staging

  deploy-prod:
    name: Deploy to Cloud-v (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl for cloud-v cluster
      run: |
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config current-context

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Deploy to production
      run: |
        export KUBECONFIG=kubeconfig
        ./scripts/deploy-helm.sh prod production ${{ github.sha }}

    - name: Run production health checks
      run: |
        export KUBECONFIG=kubeconfig
        kubectl wait --for=condition=available --timeout=600s deployment --all -n production
        kubectl get pods -n production
        echo "✅ Production deployment successful"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (table only for private repos)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-frontend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true

    - name: Run Trivy and upload SARIF (only for public repos)
      if: github.event.repository.private == false
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/stock-frontend:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results (only for public repos)
      if: github.event.repository.private == false
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

