{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-app.fullname" . }}-api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
      version: v1
      {{- include "stock-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
        {{- include "stock-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
      {{- with .Values.apiGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "stock-app.serviceAccountName" . }}
      {{- with .Values.apiGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api-gateway
        image: {{ include "stock-app.image" (dict "repository" .Values.apiGateway.image.repository "tag" .Values.apiGateway.image.tag "Values" .Values) }}
        imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy | default .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.apiGateway.service.targetPort }}
          protocol: TCP
        env:
        {{- include "stock-app.commonEnv" . | nindent 8 }}
        - name: ORDERS_SERVICE_URL
          value: {{ include "stock-app.serviceUrl" (dict "serviceName" "orders" "port" .Values.microservices.orders.service.port) }}
        - name: INVENTORY_SERVICE_URL
          value: {{ include "stock-app.serviceUrl" (dict "serviceName" "inventory" "port" .Values.microservices.inventory.service.port) }}
        - name: USERS_SERVICE_URL
          value: {{ include "stock-app.serviceUrl" (dict "serviceName" "users" "port" .Values.microservices.users.service.port) }}
        - name: REVIEWS_SERVICE_URL
          value: {{ include "stock-app.serviceUrl" (dict "serviceName" "reviews" "port" .Values.microservices.reviews.service.port) }}
        - name: RATINGS_SERVICE_URL
          value: {{ include "stock-app.serviceUrl" (dict "serviceName" "ratings" "port" .Values.microservices.ratings.service.port) }}
        {{- with .Values.apiGateway.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.apiGateway.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.apiGateway.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.apiGateway.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.apiGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}