{{- if and .Values.istio.enabled .Values.istio.authorizationPolicy.enabled }}
{{- range $serviceName := list "orders" "inventory" "users" "reviews" "ratings" }}
{{- $serviceConfig := index $.Values.microservices $serviceName }}
{{- if $serviceConfig.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "stock-app.fullname" $ }}-{{ $serviceName }}-authz
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stock-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  selector:
    matchLabels:
      app: {{ $serviceName }}
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/{{ $.Release.Namespace }}/sa/{{ include "stock-app.serviceAccountName" $ }}"]
  - when:
    - key: request.headers[x-user]
      values: {{ $.Values.istio.authorizationPolicy.allowedUsers | toJson }}

---
{{- end }}
{{- end }}

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "stock-app.fullname" . }}-frontend-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  selector:
    matchLabels:
      app: frontend
  rules:
  - {}  # Allow all traffic to frontend

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "stock-app.fullname" . }}-gateway-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  selector:
    matchLabels:
      app: api-gateway
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/{{ .Release.Namespace }}/sa/{{ include "stock-app.serviceAccountName" . }}"]
    - source:
        namespaces: ["istio-system"]
{{- end }}