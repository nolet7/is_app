{{- if and .Values.istio.enabled .Values.istio.peerAuthentication.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "stock-app.fullname" . }}-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  mtls:
    mode: {{ .Values.istio.peerAuthentication.mtlsMode }}

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "stock-app.fullname" . }}-frontend-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  selector:
    matchLabels:
      app: frontend
  mtls:
    mode: PERMISSIVE

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "stock-app.fullname" . }}-gateway-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-security
spec:
  selector:
    matchLabels:
      app: api-gateway
  mtls:
    mode: {{ .Values.istio.peerAuthentication.mtlsMode }}
{{- end }}