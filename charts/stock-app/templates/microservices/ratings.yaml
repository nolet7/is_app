{{- if .Values.microservices.ratings.enabled }}
{{- $service := .Values.microservices.ratings }}
{{- range $version, $config := $service.versions }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-app.fullname" $ }}-ratings-{{ $version }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stock-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ratings
    app.kubernetes.io/version: {{ $version }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: ratings
      version: {{ $version }}
      {{- include "stock-app.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app: ratings
        version: {{ $version }}
        {{- include "stock-app.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: ratings
        app.kubernetes.io/version: {{ $version }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $service.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "stock-app.serviceAccountName" $ }}
      containers:
      - name: ratings
        image: {{ include "stock-app.image" (dict "repository" $service.image.repository "tag" $service.image.tag "Values" $.Values) }}
        imagePullPolicy: {{ $service.image.pullPolicy | default $.Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ $service.service.targetPort }}
          protocol: TCP
        env:
        {{- include "stock-app.commonEnv" $ | nindent 8 }}
        - name: SERVICE_VERSION
          value: {{ $version | quote }}
        - name: PORT
          value: {{ $service.service.targetPort | quote }}
        {{- with $service.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $service.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $service.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stock-app.fullname" . }}-ratings-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: ratings
spec:
  type: {{ $service.service.type }}
  ports:
  - port: {{ $service.service.port }}
    targetPort: {{ $service.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: ratings
    {{- include "stock-app.selectorLabels" . | nindent 4 }}
{{- end }}