{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
{{- range $serviceName := list "orders" "inventory" "users" "reviews" "ratings" }}
{{- $serviceConfig := index $.Values.microservices $serviceName }}
{{- if $serviceConfig.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stock-app.fullname" $ }}-{{ $serviceName }}-monitor
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stock-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $serviceName }}
      {{- include "stock-app.selectorLabels" $ | nindent 6 }}
  endpoints:
  - port: http
    interval: {{ $.Values.monitoring.serviceMonitor.interval }}
    path: {{ $.Values.monitoring.serviceMonitor.path }}

---
{{- end }}
{{- end }}

{{- if .Values.apiGateway.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stock-app.fullname" . }}-api-gateway-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
      {{- include "stock-app.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    path: {{ .Values.monitoring.serviceMonitor.path }}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stock-app.fullname" . }}-frontend-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "stock-app.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    path: {{ .Values.monitoring.serviceMonitor.path }}
{{- end }}
{{- end }}