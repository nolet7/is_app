# Development environment values
global:
  env: dev
  imageTag: latest
  imagePullPolicy: Always

frontend:
  replicaCount: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: stock-app-dev.local
        paths:
          - path: /
            pathType: Prefix

apiGateway:
  replicaCount: 1

microservices:
  orders:
    versions:
      v1:
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
  
  inventory:
    versions:
      v1:
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
  
  users:
    versions:
      v1:
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
  
  reviews:
    versions:
      v1:
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
      v3:
        enabled: false
  
  ratings:
    versions:
      v1:
        replicaCount: 1
        weight: 100
      v2:
        enabled: false

istio:
  enabled: false  # Disable Istio in dev for simplicity
  
monitoring:
  enabled: false

autoscaling:
  enabled: false