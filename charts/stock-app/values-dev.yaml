# Development environment values (cluster-friendly)
global:
  env: dev
  imageTag: latest
  imagePullPolicy: IfNotPresent # friendlier for local caching
frontend:
  replicaCount: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: stock-app-dev.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
apiGateway:
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
microservices:
  orders:
    versions:
      v1:
        replicaCount: 1
        weight: 100
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      v2:
        enabled: false
    image:
      repository: stock-orders
      tag: ""
      pullPolicy: ""
    service:
      port: 5001
      targetPort: 5001
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  inventory:
    versions:
      v1:
        replicaCount: 1
        weight: 100
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      v2:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      repository: stock-inventory
      tag: ""
      pullPolicy: ""
    service:
      port: 5002
      targetPort: 5002
  users:
    versions:
      v1:
        replicaCount: 1
        weight: 100
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      v2:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      repository: stock-users
      tag: ""
      pullPolicy: ""
    service:
      port: 5003
      targetPort: 5003
  reviews:
    versions:
      v1:
        replicaCount: 1
        weight: 100
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      v2:
        enabled: false
      v3:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      repository: stock-reviews
      tag: ""
      pullPolicy: ""
    service:
      port: 5004
      targetPort: 5004
  ratings:
    versions:
      v1:
        replicaCount: 1
        weight: 100
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      v2:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      repository: stock-ratings
      tag: ""
      pullPolicy: ""
    service:
      port: 5005
      targetPort: 5005
istio:
  enabled: false # Dev is kept simple: no Istio sidecars, no mTLS
  destinationRule:
    enabled: true
  authorizationPolicy:
    allowedUsers:
      - allowed-user
monitoring:
  enabled: false # Dev doesn’t run Prometheus/Grafana
autoscaling:
  enabled: false # Prevent HPA from causing Pending pods in dev
inventory:
  image:
    repository: stock-inventory
    tag: ""
    pullPolicy: ""
  service:
    port: 5002
    targetPort: 5002
reviews:
  image:
    repository: stock-reviews
    tag: ""
    pullPolicy: ""
  service:
    port: 5004
    targetPort: 5004
ratings:
  image:
    repository: stock-ratings
    tag: ""
    pullPolicy: ""
  service:
    port: 5005
    targetPort: 5005
