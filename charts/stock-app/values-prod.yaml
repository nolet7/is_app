# Production environment values (optimized for small cluster)
global:
  env: production
  imageTag: stable-latest
  imagePullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/rate-limit: "50"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    hosts:
      - host: stock-app.yourcompany.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: stock-app-prod-tls
        hosts:
          - stock-app.yourcompany.com

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

apiGateway:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"

microservices:
  orders:
    versions:
      v1:
        replicaCount: 1
        weight: 90
      v2:
        replicaCount: 1
        weight: 10
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "300m"

  inventory:
    versions:
      v1:
        replicaCount: 1
        weight: 95
      v2:
        replicaCount: 1
        weight: 5
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "300m"

  users:
    versions:
      v1:
        replicaCount: 1
        weight: 80
      v2:
        replicaCount: 1
        weight: 20
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "300m"

  reviews:
    versions:
      v1:
        replicaCount: 1
        weight: 70
      v2:
        replicaCount: 1
        weight: 25
      v3:
        replicaCount: 1
        weight: 5
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "300m"

  ratings:
    versions:
      v1:
        replicaCount: 1
        weight: 90
      v2:
        replicaCount: 1
        weight: 10
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "300m"

istio:
  enabled: true
  gateway:
    hosts:
      - "stock-app.yourcompany.com"
    tls:
      enabled: true
      secretName: stock-app-prod-tls

  virtualService:
    faultInjection:
      enabled: false  # Disable fault injection in production

  peerAuthentication:
    mtlsMode: STRICT

  authorizationPolicy:
    enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

  grafana:
    enabled: true
    dashboards:
      enabled: true

  prometheus:
    enabled: true
    rules:
      enabled: true

autoscaling:
  enabled: false   # disable autoscaling until you have larger nodes
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

