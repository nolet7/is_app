istio:
  enabled: true
  gateway:
    hosts:
      - "stock-app.yourcompany.com"
    tls:
      enabled: true
      secretName: stock-app-prod-tls

  virtualService:
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
    faultInjection:
      enabled: false  # Disable fault injection in production

  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 50
        http:
          http1MaxPendingRequests: 50
          maxRequestsPerConnection: 10
      outlierDetection:
        consecutive5xxErrors: 5
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 60s
        maxEjectionPercent: 50

  peerAuthentication:
    enabled: true
    mtlsMode: STRICT

  authorizationPolicy:
    enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

  grafana:
    enabled: true
    dashboards:
      enabled: true

  prometheus:
    enabled: true
    rules:
      enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

