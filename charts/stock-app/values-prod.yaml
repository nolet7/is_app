# Production environment values
global:
  env: production
  imageTag: stable-latest
  imagePullPolicy: IfNotPresent
frontend:
  replicaCount: 3
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    hosts:
      - host: stock-app.yourcompany.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: stock-app-prod-tls
        hosts:
          - stock-app.yourcompany.com
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
apiGateway:
  replicaCount: 3
  service:
    port: 3001
    targetPort: 3001
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
microservices:
  orders:
    versions:
      v1:
        replicaCount: 3
        weight: 90
      v2:
        replicaCount: 1
        weight: 10
    service:
      port: 5001
      targetPort: 5001
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-orders
      tag: ""
      pullPolicy: ""
  inventory:
    versions:
      v1:
        replicaCount: 3
        weight: 95
      v2:
        replicaCount: 1
        weight: 5
    service:
      port: 5002
      targetPort: 5002
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-inventory
      tag: ""
      pullPolicy: ""
  users:
    versions:
      v1:
        replicaCount: 3
        weight: 80
      v2:
        replicaCount: 1
        weight: 20
    service:
      port: 5003
      targetPort: 5003
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-users
      tag: ""
      pullPolicy: ""
  reviews:
    versions:
      v1:
        replicaCount: 2
        weight: 70
      v2:
        replicaCount: 2
        weight: 25
      v3:
        replicaCount: 1
        weight: 5
    service:
      port: 5004
      targetPort: 5004
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-reviews
      tag: ""
      pullPolicy: ""
  ratings:
    versions:
      v1:
        replicaCount: 3
        weight: 90
      v2:
        replicaCount: 1
        weight: 10
    service:
      port: 5005
      targetPort: 5005
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-ratings
      tag: ""
      pullPolicy: ""
istio:
  enabled: true
  gateway:
    hosts:
      - "stock-app.yourcompany.com"
    tls:
      enabled: true
      secretName: stock-app-prod-tls
  virtualService:
    faultInjection:
      enabled: false
  peerAuthentication:
    mtlsMode: STRICT
  authorizationPolicy:
    enabled: true
serviceAccount:
  create: true
  name: ""
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
  grafana:
    enabled: true
    dashboards:
      enabled: true
  prometheus:
    enabled: true
    rules:
      enabled: true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
inventory:
  image:
    repository: stock-inventory
    tag: ""
    pullPolicy: ""
  service:
    port: 5002
    targetPort: 5002
reviews:
  image:
    repository: stock-reviews
    tag: ""
    pullPolicy: ""
  service:
    port: 5004
    targetPort: 5004
ratings:
  image:
    repository: stock-ratings
    tag: ""
    pullPolicy: ""
  service:
    port: 5005
    targetPort: 5005
