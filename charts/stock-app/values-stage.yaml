# Staging environment values (cluster-friendly)
global:
  env: staging
  imageTag: staging-latest
  imagePullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - host: stock-app-staging.yourcompany.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: stock-app-staging-tls
        hosts:
          - stock-app-staging.yourcompany.com

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

apiGateway:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

microservices:
  orders:
    versions:
      v1:
        replicaCount: 1
        weight: 70
      v2:
        replicaCount: 1
        weight: 30
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  inventory:
    versions:
      v1:
        replicaCount: 1
        weight: 80
      v2:
        replicaCount: 1
        weight: 20
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  users:
    versions:
      v1:
        replicaCount: 1
        weight: 60
      v2:
        replicaCount: 1
        weight: 40
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  reviews:
    versions:
      v1:
        replicaCount: 1
        weight: 50
      v2:
        replicaCount: 1
        weight: 40
      v3:
        replicaCount: 1
        weight: 10
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  ratings:
    versions:
      v1:
        replicaCount: 1
        weight: 75
      v2:
        replicaCount: 1
        weight: 25
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

istio:
  enabled: true
  gateway:
    hosts:
      - "stock-app-staging.yourcompany.com"

  virtualService:
    timeout: 15s
    retries:
      attempts: 2
      perTryTimeout: 5s
    faultInjection:
      enabled: true
      delay:
        percentage: 5
        fixedDelay: 1s
      abort:
        percentage: 2
        httpStatus: 503

  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 5
        http:
          http1MaxPendingRequests: 5
          maxRequestsPerConnection: 2
      outlierDetection:
        consecutive5xxErrors: 2
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50

  peerAuthentication:
    enabled: true
    mtlsMode: STRICT

  authorizationPolicy:
    enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics

autoscaling:
  enabled: false   # Disabled to avoid CPU pressure in staging
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

