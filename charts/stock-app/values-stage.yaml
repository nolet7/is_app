# Staging environment values
global:
  env: staging
  imageTag: staging-latest
  imagePullPolicy: Always
frontend:
  replicaCount: 2
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - host: stock-app-staging.yourcompany.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: stock-app-staging-tls
        hosts:
          - stock-app-staging.yourcompany.com
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
apiGateway:
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  service:
    port: 3001
    targetPort: 3001
microservices:
  orders:
    versions:
      v1:
        replicaCount: 2
        weight: 70
      v2:
        replicaCount: 1
        weight: 30
    service:
      port: 5001
      targetPort: 5001
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-orders
      tag: ""
      pullPolicy: ""
  inventory:
    versions:
      v1:
        replicaCount: 2
        weight: 80
      v2:
        replicaCount: 1
        weight: 20
    service:
      port: 5002
      targetPort: 5002
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-inventory
      tag: ""
      pullPolicy: ""
  users:
    versions:
      v1:
        replicaCount: 2
        weight: 60
      v2:
        replicaCount: 1
        weight: 40
    service:
      port: 5003
      targetPort: 5003
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-users
      tag: ""
      pullPolicy: ""
  reviews:
    versions:
      v1:
        replicaCount: 2
        weight: 50
      v2:
        replicaCount: 1
        weight: 40
      v3:
        replicaCount: 1
        weight: 10
    service:
      port: 5004
      targetPort: 5004
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-reviews
      tag: ""
      pullPolicy: ""
  ratings:
    versions:
      v1:
        replicaCount: 2
        weight: 75
      v2:
        replicaCount: 1
        weight: 25
    service:
      port: 5005
      targetPort: 5005
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    image:
      repository: stock-ratings
      tag: ""
      pullPolicy: ""
istio:
  enabled: true
  gateway:
    hosts:
      - "stock-app-staging.yourcompany.com"
  virtualService:
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
    faultInjection:
      enabled: true
      delay:
        percentage: 5
        fixedDelay: 1s
      abort:
        percentage: 2
        httpStatus: 503
  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 20
        http:
          http1MaxPendingRequests: 20
          maxRequestsPerConnection: 5
      outlierDetection:
        consecutive5xxErrors: 3
        consecutiveGatewayErrors: 3
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
  peerAuthentication:
    enabled: true
    mtlsMode: STRICT
  authorizationPolicy:
    enabled: true
    allowedUsers:
      - allowed-user
serviceAccount:
  create: true
  name: ""
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    path: /metrics
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
inventory:
  image:
    repository: stock-inventory
    tag: ""
    pullPolicy: ""
  service:
    port: 5002
    targetPort: 5002
reviews:
  image:
    repository: stock-reviews
    tag: ""
    pullPolicy: ""
  service:
    port: 5004
    targetPort: 5004
ratings:
  image:
    repository: stock-ratings
    tag: ""
    pullPolicy: ""
  service:
    port: 5005
    targetPort: 5005
