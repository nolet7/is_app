# Default values for stock-app (cluster-friendly dev baseline)
global:
  imageRegistry: docker.io/noletengine
  imageTag: latest
  imagePullPolicy: IfNotPresent
  env: dev

  labels:
    app.kubernetes.io/name: stock-app
    app.kubernetes.io/instance: stock-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: stock-management-platform
    app.kubernetes.io/managed-by: helm

# Frontend configuration
frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  image:
    repository: stock-frontend
    tag: ""
    pullPolicy: ""

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: false

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 20
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

# API Gateway
apiGateway:
  enabled: true
  name: api-gateway
  replicaCount: 1
  image:
    repository: stock-api-gateway
    tag: ""
    pullPolicy: ""

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Microservices (lightweight, single replica by default)
microservices:
  orders:
    enabled: true
    versions:
      v1:
        enabled: true
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  inventory:
    enabled: true
    versions:
      v1:
        enabled: true
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  users:
    enabled: true
    versions:
      v1:
        enabled: true
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  reviews:
    enabled: true
    versions:
      v1:
        enabled: true
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
      v3:
        enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  ratings:
    enabled: true
    versions:
      v1:
        enabled: true
        replicaCount: 1
        weight: 100
      v2:
        enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

# Istio (disabled in dev baseline to avoid sidecar overhead)
istio:
  enabled: false

# Monitoring (disabled for dev baseline)
monitoring:
  enabled: false

# Autoscaling (disabled in dev baseline to avoid Pending pods)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

