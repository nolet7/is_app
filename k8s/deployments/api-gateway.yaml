apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ${NAMESPACE:-default}
  labels:
    app: api-gateway
    version: v1
    environment: ${ENVIRONMENT:-dev}
spec:
  replicas: ${API_GATEWAY_REPLICAS:-1}
  selector:
    matchLabels:
      app: api-gateway
      version: v1
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
        environment: ${ENVIRONMENT:-dev}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: ${IMAGE_REGISTRY:-docker.io/noletengine}/stock-api-gateway:${IMAGE_TAG:-latest}
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "${NODE_ENV:-development}"
        - name: ENVIRONMENT
          value: "${ENVIRONMENT:-dev}"
        - name: ORDERS_SERVICE_URL
          value: "http://${ORDERS_SERVICE_NAME:-orders-service}:5001"
        - name: INVENTORY_SERVICE_URL
          value: "http://${INVENTORY_SERVICE_NAME:-inventory-service}:5002"
        - name: USERS_SERVICE_URL
          value: "http://${USERS_SERVICE_NAME:-users-service}:5003"
        - name: REVIEWS_SERVICE_URL
          value: "http://${REVIEWS_SERVICE_NAME:-reviews-service}:5004"
        - name: RATINGS_SERVICE_URL
          value: "http://${RATINGS_SERVICE_NAME:-ratings-service}:5005"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: ${LIVENESS_DELAY:-30}
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: ${READINESS_DELAY:-10}
          periodSeconds: 5
        resources:
          requests:
            memory: "${API_GATEWAY_MEMORY_REQUEST:-128Mi}"
            cpu: "${API_GATEWAY_CPU_REQUEST:-100m}"
          limits:
            memory: "${API_GATEWAY_MEMORY_LIMIT:-256Mi}"
            cpu: "${API_GATEWAY_CPU_LIMIT:-200m}"