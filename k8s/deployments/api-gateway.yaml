apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      version: v1
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: docker.io/noletengine/stock-api-gateway:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: ORDERS_SERVICE_URL
          value: "http://orders-service:5001"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:5002"
        - name: USERS_SERVICE_URL
          value: "http://users-service:5003"
        - name: REVIEWS_SERVICE_URL
          value: "http://reviews-service:5004"
        - name: RATINGS_SERVICE_URL
          value: "http://ratings-service:5005"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"