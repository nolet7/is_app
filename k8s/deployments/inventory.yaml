apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v1
  namespace: ${NAMESPACE:-default}
  labels:
    app: inventory
    version: v1
    environment: ${ENVIRONMENT:-dev}
spec:
  replicas: ${INVENTORY_V1_REPLICAS:-1}
  selector:
    matchLabels:
      app: inventory
      version: v1
  template:
    metadata:
      labels:
        app: inventory
        version: v1
        environment: ${ENVIRONMENT:-dev}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: inventory
        image: ${IMAGE_REGISTRY:-docker.io/noletengine}/stock-inventory:${IMAGE_TAG:-latest}
        ports:
        - containerPort: 5002
        env:
        - name: SERVICE_VERSION
          value: "v1"
        - name: PORT
          value: "5002"
        - name: ENVIRONMENT
          value: "${ENVIRONMENT:-dev}"
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: ${LIVENESS_DELAY:-30}
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: ${READINESS_DELAY:-5}
          periodSeconds: 5
        resources:
          requests:
            memory: "${SERVICE_MEMORY_REQUEST:-64Mi}"
            cpu: "${SERVICE_CPU_REQUEST:-50m}"
          limits:
            memory: "${SERVICE_MEMORY_LIMIT:-128Mi}"
            cpu: "${SERVICE_CPU_LIMIT:-100m}"

---
