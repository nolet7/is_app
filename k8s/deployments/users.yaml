apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-v1
  labels:
    app: users
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
      version: v1
  template:
    metadata:
      labels:
        app: users
        version: v1
    spec:
      containers:
      - name: users
        image: istio-demo/users:latest
        ports:
        - containerPort: 5003
        env:
        - name: SERVICE_VERSION
          value: "v1"
        - name: PORT
          value: "5003"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
