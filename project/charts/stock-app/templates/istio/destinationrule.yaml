{{- if and .Values.istio.enabled .Values.istio.destinationRule.enabled }}
{{- range $serviceName := list "orders" "inventory" "users" "reviews" "ratings" }}
{{- $serviceConfig := index $.Values.microservices $serviceName }}
{{- if $serviceConfig.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "stock-app.fullname" $ }}-{{ $serviceName }}-dr
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stock-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: istio-destinationrule
spec:
  host: {{ include "stock-app.fullname" $ }}-{{ $serviceName }}-service
  {{- with $.Values.istio.destinationRule.trafficPolicy }}
  trafficPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  subsets:
  {{- range $version, $config := $serviceConfig.versions }}
  {{- if $config.enabled }}
  - name: {{ $version }}
    labels:
      version: {{ $version }}
  {{- end }}
  {{- end }}

---
{{- end }}
{{- end }}

{{- if .Values.apiGateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "stock-app.fullname" . }}-api-gateway-dr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-destinationrule
spec:
  host: {{ include "stock-app.fullname" . }}-api-gateway-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 20
        maxRequestsPerConnection: 5
{{- end }}
{{- end }}