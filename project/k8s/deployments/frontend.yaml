apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ${NAMESPACE:-default}
  labels:
    app: frontend
    version: v1
    environment: ${ENVIRONMENT:-dev}
spec:
  replicas: ${FRONTEND_REPLICAS:-1}
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
        environment: ${ENVIRONMENT:-dev}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: frontend
        image: ${IMAGE_REGISTRY:-docker.io/noletengine}/stock-frontend:${IMAGE_TAG:-latest}
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "${NODE_ENV:-development}"
        - name: ENVIRONMENT
          value: "${ENVIRONMENT:-dev}"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: ${LIVENESS_DELAY:-30}
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: ${READINESS_DELAY:-5}
          periodSeconds: 5
        resources:
          requests:
            memory: "${FRONTEND_MEMORY_REQUEST:-64Mi}"
            cpu: "${FRONTEND_CPU_REQUEST:-50m}"
          limits:
            memory: "${FRONTEND_MEMORY_LIMIT:-128Mi}"
            cpu: "${FRONTEND_CPU_LIMIT:-100m}"