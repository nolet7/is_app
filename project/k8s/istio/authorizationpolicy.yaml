apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: orders-authz
  labels:
    app: stock-app
spec:
  selector:
    matchLabels:
      app: orders
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/default"]
  - when:
    - key: request.headers[x-user]
      values: ["allowed-user"]

