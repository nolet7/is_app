apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: stock-app-gateway
  namespace: ${NAMESPACE:-default}
  labels:
    app: stock-app
    environment: ${ENVIRONMENT:-dev}
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "${GATEWAY_HOST:-*}"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: ${TLS_SECRET_NAME:-stock-app-tls}
    hosts:
    - "${GATEWAY_HOST:-*}"